# Flags and groups for the public repositories.
# flag_order is the order in the sidebar. A repository can carry more than one flag.
# Add another [[groups]] block to cluster more repositories.
# Repositories left out of this file still appear, under Projects, with no flags.

flag_order = ["AI", "work", "container", "finance"]

[[groups]]
id = "nodes"
title = "Nodes"
summary = "RootNode and the services beside it for faces, text, handwriting, color, and structured queries."
repos = ["facenode", "rootnode", "parsenode", "colornode", "textnode", "htrnode"]

[[projects]]
name = "facenode"
flags = ["AI"]

