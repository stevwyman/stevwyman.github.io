# Build the Hugo site and publish it with GitHub Pages.
#
# This repository is stevwyman.github.io, so Pages serves it at
# https://stevwyman.github.io. The source stays on main. The built site is
# uploaded as a Pages artifact. No personal access token and no git push.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Public READMEs are fetched with the workflow token. Private repositories are
# ignored. Forks are ignored unless INCLUDE_FORKS=true.

name: Publish site

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test README processing
        run: python3 scripts/test_build_content.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build pages from READMEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name || github.repository_owner }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/build_content.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: hugo --gc --minify --cleanDestinationDir --baseURL "$SITE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
